<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — ComNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .side { background: var(--ink); color: var(--panel); padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; }
    .side .wordmark { color: var(--panel); font-size: 16px; }
    .side .wordmark small { color: rgba(255,255,255,.55); }
    .side blockquote { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 500; letter-spacing: -.01em; max-width: 26ch; }
    .side .facts { display: grid; grid-template-columns: repeat(3, auto); gap: 28px; justify-content: start; font-size: 12.5px; color: rgba(255,255,255,.6); }
    .side .facts b { display: block; color: var(--panel); font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .form-side { display: grid; place-items: center; padding: 32px 16px; }
    form { width: min(340px, 100%); display: grid; gap: 14px; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
    .input { height: 38px; width: 100%; }
    .btn.primary { height: 38px; }
    .error { color: var(--u-critical); font-size: 13px; min-height: 18px; margin: 0; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; } .side { display: none; } }
  </style>
</head>
<body>
  <aside class="side">
    <span class="wordmark" id="brand"></span>
    <blockquote>Every complaint a citizen speaks into WhatsApp lands here — with a photo, a place and a reference number they can hold you to.</blockquote>
    <div class="facts"><div><b>English · Yorùbá</b>voice intake</div><div><b>NIPOST</b>digital postcodes</div><div><b>Public</b>Trust Scores</div></div>
  </aside>
  <main class="form-side">
    <form id="login" autocomplete="on">
      <div>
        <h1>Officer sign in</h1>
        <p class="muted" style="margin:0">LGA and agency staff only.</p>
      </div>
      <label class="field">Username <input class="input" name="username" autocomplete="username" required autofocus></label>
      <label class="field">Password <input class="input" name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="error" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
      <a class="faint small" href="/" style="font-size:12.5px">← Public transparency portal</a>
    </form>
  </main>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    document.getElementById("brand").innerHTML = `${VT_LOGO}<span>ComNote</span>`;
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const button = e.target.querySelector("button");
      button.disabled = true;
      document.getElementById("error").textContent = "";
      try {
        const res = await VT.api("/admin/login", { method: "POST", body: { username: form.get("username"), password: form.get("password") } });
        VT.setToken(res.token);
        location.href = "/admin";
      } catch (err) {
        document.getElementById("error").textContent = err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
